name: Installation and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          python -m venv MetacellFormer-env
          echo "$GITHUB_WORKSPACE/MetacellFormer-env/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r configs/evaluation-requirements.txt '.[evaluation,test]'
      - run: python -m pip check
      - run: python -m pytest -q tests
  metaq:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: |
          python -m venv MetaQ-env
          echo "$GITHUB_WORKSPACE/MetaQ-env/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.1.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r configs/metaq-requirements.txt
      - run: |
          METAQ_DIR=$(python -c 'import importlib.util; print(next(iter(importlib.util.find_spec("MetaQ_sc").submodule_search_locations)))')
          patch --dry-run -d "$METAQ_DIR" -p1 < patches/metaq.patch
          patch -d "$METAQ_DIR" -p1 < patches/metaq.patch
      - run: python -m pip check
      - run: python tests/check_metaq.py
